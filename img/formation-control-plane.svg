<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb0ff" />
    </marker>
  </defs>

  <!-- kubectl / clients -->
  <rect x="150" y="10" width="180" height="42" rx="8" fill="#182234" stroke="#2c3a52" stroke-width="1.5" />
  <text x="240" y="36" text-anchor="middle" fill="#e6edf6" font-size="15">kubectl / clients API</text>
  <line x1="240" y1="52" x2="240" y2="86" stroke="#7fb0ff" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Control plane outer box -->
  <rect x="30" y="86" width="400" height="330" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="46" y="108" fill="#93a4bd" font-size="13" letter-spacing="1">CONTROL PLANE</text>

  <!-- kube-apiserver (hub) -->
  <rect x="70" y="118" width="320" height="54" rx="10" fill="#326ce5" />
  <text x="230" y="150" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">kube-apiserver</text>

  <!-- etcd -->
  <rect x="130" y="192" width="200" height="42" rx="8" fill="#1f2c42" stroke="#2c3a52" stroke-width="1.5" />
  <text x="230" y="218" text-anchor="middle" fill="#e6edf6" font-size="14">etcd</text>

  <!-- scheduler -->
  <rect x="60" y="250" width="170" height="42" rx="8" fill="#1f2c42" stroke="#2c3a52" stroke-width="1.5" />
  <text x="145" y="276" text-anchor="middle" fill="#e6edf6" font-size="13">kube-scheduler</text>

  <!-- controller-manager -->
  <rect x="240" y="250" width="180" height="42" rx="8" fill="#1f2c42" stroke="#2c3a52" stroke-width="1.5" />
  <text x="330" y="276" text-anchor="middle" fill="#e6edf6" font-size="12.5">kube-controller-manager</text>

  <!-- cloud-controller-manager (optional) -->
  <rect x="90" y="320" width="280" height="40" rx="8" fill="none" stroke="#93a4bd" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="230" y="345" text-anchor="middle" fill="#93a4bd" font-size="12.5">cloud-controller-manager (optionnel)</text>

  <!-- arrows within control plane -->
  <line x1="230" y1="172" x2="230" y2="188" stroke="#7fb0ff" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <line x1="160" y1="250" x2="200" y2="176" stroke="#7fb0ff" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="330" y1="250" x2="270" y2="176" stroke="#7fb0ff" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="230" y1="320" x2="230" y2="176" stroke="#93a4bd" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- Node (worker) outer box, with a second faint box behind to suggest "plusieurs nœuds" -->
  <rect x="490" y="100" width="380" height="316" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55" />
  <rect x="470" y="86" width="380" height="330" rx="14" fill="none" stroke="#2c3a52" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="486" y="108" fill="#93a4bd" font-size="13" letter-spacing="1">NODE (WORKER) — × N</text>

  <!-- kubelet -->
  <rect x="510" y="118" width="300" height="46" rx="9" fill="#1f2c42" stroke="#2c3a52" stroke-width="1.5" />
  <text x="660" y="146" text-anchor="middle" fill="#e6edf6" font-size="14">kubelet</text>

  <!-- kube-proxy -->
  <rect x="510" y="176" width="300" height="42" rx="8" fill="#1f2c42" stroke="#2c3a52" stroke-width="1.5" />
  <text x="660" y="202" text-anchor="middle" fill="#e6edf6" font-size="13.5">kube-proxy</text>

  <!-- container runtime -->
  <rect x="510" y="230" width="300" height="42" rx="8" fill="#1f2c42" stroke="#2c3a52" stroke-width="1.5" />
  <text x="660" y="256" text-anchor="middle" fill="#e6edf6" font-size="13">container runtime (containerd, CRI-O…)</text>

  <!-- Pods -->
  <rect x="510" y="286" width="300" height="76" rx="10" fill="none" stroke="#93a4bd" stroke-width="1.2" stroke-dasharray="3 3" />
  <text x="660" y="302" text-anchor="middle" fill="#93a4bd" font-size="11.5">Pods</text>
  <rect x="524" y="310" width="76" height="40" rx="6" fill="#22c55e" opacity="0.85" />
  <text x="562" y="334" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">Pod</text>
  <rect x="612" y="310" width="76" height="40" rx="6" fill="#22c55e" opacity="0.85" />
  <text x="650" y="334" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">Pod</text>
  <rect x="700" y="310" width="76" height="40" rx="6" fill="#22c55e" opacity="0.6" />
  <text x="738" y="334" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">Pod</text>

  <!-- internal worker arrows -->
  <line x1="660" y1="164" x2="660" y2="172" stroke="#7fb0ff" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="660" y1="218" x2="660" y2="226" stroke="#7fb0ff" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="660" y1="272" x2="660" y2="282" stroke="#7fb0ff" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- apiserver <-> kubelet (cross-panel, long link) -->
  <line x1="390" y1="145" x2="505" y2="141" stroke="#7fb0ff" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="447" y="130" text-anchor="middle" fill="#93a4bd" font-size="10.5">watch / report status</text>

  <!-- Legend -->
  <line x1="60" y1="470" x2="100" y2="470" stroke="#7fb0ff" stroke-width="2" marker-end="url(#arrow)" />
  <text x="110" y="474" fill="#93a4bd" font-size="12">appel à l'API (kube-apiserver = point d'entrée unique)</text>
  <line x1="60" y1="496" x2="100" y2="496" stroke="#93a4bd" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="110" y="500" fill="#93a4bd" font-size="12">composant optionnel</text>

  <text x="30" y="540" fill="#93a4bd" font-size="12.5">Le control plane décide (scheduling, réconciliation d'état) ; chaque nœud exécute — kubelet fait tourner les Pods,</text>
  <text x="30" y="560" fill="#93a4bd" font-size="12.5">kube-proxy gère les règles réseau des Services, le container runtime démarre les conteneurs. Tout passe par kube-apiserver :</text>
  <text x="30" y="580" fill="#93a4bd" font-size="12.5">c'est le seul composant qui lit/écrit dans etcd, la source de vérité du cluster.</text>
</svg>
